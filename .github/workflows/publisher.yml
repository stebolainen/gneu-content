name: autonomous-publisher

on:
  # Primary path: run immediately after content validation completes.
  # The publisher never consumes artifacts or code from the triggering run;
  # it checks out trusted main and revalidates the selected PR independently.
  workflow_run:
    workflows:
      - validate-content
    types:
      - completed

  # Fallback only. GitHub schedules are best-effort and may be delayed.
  schedule:
    - cron: "2-59/5 * * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the full gate without merging"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: gneu-autonomous-publisher
  cancel-in-progress: false

jobs:
  publisher:
    if: >-
      ${{
        (
          vars.AUTOPUBLISH_ENABLED == 'true' &&
          (
            github.event_name != 'workflow_run' ||
            (
              github.event.workflow_run.event == 'pull_request' &&
              github.event.workflow_run.conclusion == 'success' &&
              startsWith(github.event.workflow_run.head_branch, 'adam/')
            )
          )
        ) ||
        (github.event_name == 'workflow_dispatch' && inputs.dry_run)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List Adam candidates oldest first
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          set -f
          root=/tmp/gneu-publisher
          mkdir -p "$root"

          # Bounded listing. LIST_LIMIT bounds what we ask GitHub for and
          # MAX_CANDIDATES bounds what one run will evaluate. Hitting either
          # bound is reported explicitly and fails the run: a candidate must
          # never be silently dropped because a list was truncated.
          LIST_LIMIT=100
          MAX_CANDIDATES=25

          gh pr list \
            --repo "$REPO" \
            --base published \
            --state open \
            --limit "$LIST_LIMIT" \
            --json number,headRefName,createdAt \
            > "$root/open-prs.json"

          total="$(jq 'length' "$root/open-prs.json")"
          if [[ ! "$total" =~ ^[0-9]+$ ]]; then
            echo "Could not count open PRs" >&2
            exit 1
          fi

          if (( total >= LIST_LIMIT )); then
            echo "BLOCKED: open PR listing hit the $LIST_LIMIT bound and may be truncated" >&2
            echo "Resolve the PR backlog before the publisher can run safely." >&2
            exit 1
          fi

          found="$(
            jq -r '
              [.[] | select(.headRefName | startswith("adam/"))]
              | sort_by(.createdAt)
              | .[].number
            ' "$root/open-prs.json"
          )"

          candidates=()
          for pr in $found; do
            if [[ ! "$pr" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid PR number" >&2
              exit 1
            fi
            candidates+=("$pr")
          done

          if (( ${#candidates[@]} > MAX_CANDIDATES )); then
            echo "BLOCKED: ${#candidates[@]} Adam candidates exceeds the $MAX_CANDIDATES evaluation bound" >&2
            echo "Refusing to evaluate a partial queue; triage the backlog first." >&2
            exit 1
          fi

          if (( ${#candidates[@]} == 0 )); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "NO_PR"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "candidates=${candidates[*]}" >> "$GITHUB_OUTPUT"
          echo "Candidate queue (${#candidates[@]}): ${candidates[*]}"

      - name: Fetch public AI-hot coverage
        if: steps.pick.outputs.found == 'true'
        env:
          AIHOT_URL: https://gneu.se/data/aihot.json
          AIHOT_MAX_BYTES: "2097152"
        shell: bash
        run: |
          set -euo pipefail

          curl             --fail             --silent             --show-error             --location             --proto '=https'             --proto-redir '=https'             --tlsv1.2             --connect-timeout 5             --max-time 15             --max-filesize "$AIHOT_MAX_BYTES"             --output /tmp/gneu-publisher/aihot.json             "${AIHOT_URL}?publisher_run=${GITHUB_RUN_ID}"

          test -s /tmp/gneu-publisher/aihot.json

          bytes="$(wc -c < /tmp/gneu-publisher/aihot.json)"
          if (( bytes > AIHOT_MAX_BYTES )); then
            echo "AI-hot coverage exceeds maximum size" >&2
            exit 1
          fi

          echo "AIHOT_COVERAGE_FETCH: PASS ($bytes bytes)"

      - name: Evaluate candidate queue
        id: queue
        if: steps.pick.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATES: ${{ steps.pick.outputs.candidates }}
        shell: bash
        run: |
          set -euo pipefail
          set -f
          root=/tmp/gneu-publisher

          base_sha="$(gh api "repos/$REPO/git/ref/heads/published" --jq '.object.sha')"
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid base SHA" >&2
            exit 1
          fi

          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPO/contents/events.json?ref=$base_sha" \
            > "$root/base-events.json"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPO/contents/manifest.json?ref=$base_sha" \
            > "$root/base-manifest.json"

          chosen=""
          chosen_sha=""
          needs_human=()

          for pr in $CANDIDATES; do
            if [[ ! "$pr" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid PR number" >&2
              exit 1
            fi

            echo "::group::candidate PR #$pr"

            # Untrusted PR material, fetched as data only. Never checked out.
            gh api "repos/$REPO/pulls/$pr" > "$root/pr.json"

            api_number="$(jq -r '.number' "$root/pr.json")"
            if [[ "$api_number" != "$pr" ]]; then
              echo "PR payload number mismatch" >&2
              exit 1
            fi

            head_sha="$(jq -r '.head.sha' "$root/pr.json")"
            if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid head SHA" >&2
              exit 1
            fi

            gh api "repos/$REPO/pulls/$pr/files?per_page=100" > "$root/files.json"
            gh api "repos/$REPO/commits/$head_sha/check-runs?per_page=100" > "$root/checks.json"
            gh api "repos/$REPO/compare/$base_sha...$head_sha" > "$root/compare.json"
            gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/$REPO/contents/events.json?ref=$head_sha" \
              > "$root/head-events.json"
            gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/$REPO/contents/manifest.json?ref=$head_sha" \
              > "$root/head-manifest.json"

            rc=0
            python3 publisher_gate.py \
              --repository "$REPO" \
              --current-base-sha "$base_sha" \
              --pr "$root/pr.json" \
              --files "$root/files.json" \
              --checks "$root/checks.json" \
              --compare "$root/compare.json" \
              --base-events "$root/base-events.json" \
              --base-manifest "$root/base-manifest.json" \
              --head-events "$root/head-events.json" \
              --head-manifest "$root/head-manifest.json" \
              --aihot-coverage "$root/aihot.json" \
              --trusted-validator ./validate_content.py \
              --json-out "$root/decision.json" || rc=$?

            echo "::endgroup::"

            case "$rc" in
              0)
                decision_outcome="$(jq -r '.outcome' "$root/decision.json")"
                decision_pr="$(jq -r '.pr_number' "$root/decision.json")"
                decision_sha="$(jq -r '.head_sha' "$root/decision.json")"
                if [[ "$decision_outcome" != "ACTIONABLE" ]]; then
                  echo "Gate exited 0 without an ACTIONABLE decision" >&2
                  exit 1
                fi
                if [[ "$decision_pr" != "$pr" || "$decision_sha" != "$head_sha" ]]; then
                  echo "Gate decision does not match evaluated candidate" >&2
                  exit 1
                fi
                chosen="$decision_pr"
                chosen_sha="$decision_sha"
                echo "ACTIONABLE: PR #$chosen @ $chosen_sha"
                break
                ;;
              3)
                echo "NOOP_STALE: PR #$pr has no net diff; trying next candidate"
                ;;
              4)
                echo "POLICY_SKIP: PR #$pr declined by content policy; trying next candidate"
                ;;
              5)
                # Understood, not publishable, and a person is notified from
                # the decision payload. It must not hold up other candidates.
                reason="$(jq -r '.reason_code // "NEEDS_HUMAN"' "$root/decision.json")"
                echo "NEEDS_HUMAN [$reason]: PR #$pr awaits a human; trying next candidate"
                needs_human+=("$pr")
                ;;
              *)
                # We cannot safely say what happened: malformed metadata,
                # integrity, validator, security or an unknown state.
                # Fail closed and stop the queue.
                echo "Publisher gate failed for PR #$pr (exit $rc)" >&2
                exit 1
                ;;
            esac
          done

          if [[ -n "$chosen" ]]; then
            echo "actionable=true" >> "$GITHUB_OUTPUT"
            echo "number=$chosen" >> "$GITHUB_OUTPUT"
            echo "head_sha=$chosen_sha" >> "$GITHUB_OUTPUT"
          else
            echo "actionable=false" >> "$GITHUB_OUTPUT"
            echo "NO_ACTIONABLE_CANDIDATE"
          fi

          if (( ${#needs_human[@]} > 0 )); then
            echo "Awaiting human review: ${needs_human[*]}"
          fi

      - name: Dry-run result
        if: >-
          steps.queue.outputs.actionable == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.dry_run
        run: |
          echo "DRY_RUN_PASS"
          cat /tmp/gneu-publisher/decision.json

      - name: Mint short-lived publisher token
        id: app-token
        if: >-
          steps.queue.outputs.actionable == 'true' &&
          vars.AUTOPUBLISH_ENABLED == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: gneu-content
          permission-contents: write
          permission-pull-requests: write

      - name: Merge exact validated head
        if: >-
          steps.queue.outputs.actionable == 'true' &&
          vars.AUTOPUBLISH_ENABLED == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.queue.outputs.number }}
          HEAD_SHA: ${{ steps.queue.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR" \
            --repo "$REPO" \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA"

          echo "AUTOPUBLISHED PR #$PR @ $HEAD_SHA"
