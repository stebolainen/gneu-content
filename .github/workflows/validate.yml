name: validate-content

on:
  pull_request:
  push:
    branches:
      - published

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 validate_content.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 test_admin_auth_policy.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 test_publisher_gate.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 test_publisher_policy_gate.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 test_publisher_benign_skip.py
